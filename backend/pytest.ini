[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
# Ensure parametrize markers are registered to avoid PytestUnknownMarkWarning
markers =
    parametrize: parametrize test function with multiple argument sets

# Default addopts: show short summary of failures only when no --cov flag
# Run with: python -m pytest --cov=app --cov-report=term-missing for full coverage
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
