name: CarboECO Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pip-audit

      - name: Backend lint gate
        run: ruff check backend/app backend/tests

      - name: Backend type/import gate
        run: python -m compileall -q backend/app backend/tests

      - name: Backend security audit gate
        run: |
          pip-audit -r backend/requirements.txt --format json --output backend-pip-audit-report.json

      - name: Upload backend dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pip-audit-report
          path: backend-pip-audit-report.json

      - name: Backend coverage gate
        run: |
          cd backend
          pytest tests --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=90

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/

  frontend-quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend lint gate
        run: |
          cd frontend
          npm run lint

      - name: Frontend type gate
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Frontend security audit gate
        run: |
          cd frontend
          npm audit --audit-level=high --json > ../frontend-npm-audit-report.json

      - name: Upload frontend dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: frontend-npm-audit-report.json

      - name: Frontend test coverage gate
        run: |
          cd frontend
          npm run test -- --coverage --coverage.thresholds.lines=90 --coverage.thresholds.functions=90 --coverage.thresholds.branches=90 --coverage.thresholds.statements=90

      - name: Frontend build gate
        run: |
          cd frontend
          npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  accessibility-quality:
    name: Playwright Axe Accessibility Gates
    runs-on: ubuntu-latest
    needs: [frontend-quality]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run accessibility gate
        run: |
          cd frontend
          npm run test:a11y

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: frontend/accessibility-report/
